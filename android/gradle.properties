# The build hosts are shared and short on memory: keep Gradle and Kotlin small.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# The published artifact: org.tunaos.proton:proton-sdk-android:<VERSION_NAME>.
GROUP=org.tunaos.proton
VERSION_NAME=0.1.0
