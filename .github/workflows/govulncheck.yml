name: govulncheck

# Known-vulnerability scan of the Go code that ships in the AAR and the
# helper: it fails when an advisory has a call path from protonsdk or cmd/.
# The weekly run catches advisories published after the last merge.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels the superseded run. Pushes to main are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Scan
        env:
          GOFLAGS: -mod=vendor
        run: |
          GOFLAGS= go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./protonsdk/... ./cmd/...
